<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XVideos Crawler Dashboard</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #14141a;
      --surface-hover: #1e1e26;
      --surface-elevated: #25252f;
      --text: #f0f0f5;
      --text-secondary: #90909a;
      --accent: #ff6b35;
      --accent-hover: #e85a28;
      --accent-glow: rgba(255, 107, 53, 0.25);
      --border: #2a2a35;
      --success: #22c55e;
      --error: #ef4444;
      --radius: 14px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      background: rgba(20, 20, 26, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-content {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #ff9f7a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.03em;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="text"], input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    input[type="number"] { width: 65px; text-align: center; }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    button:hover { background: var(--accent-hover); transform: translateY(-1px); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: var(--surface-elevated); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: rgba(255,107,53,0.08); }

    .tabs {
      display: flex;
      gap: 0.25rem;
      background: var(--bg);
      padding: 0.3rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .tab {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--surface-hover);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .tab:hover:not(.active) { color: var(--text); }

    .tab-panel-inline { display: none; gap: 0.5rem; align-items: center; }
    .tab-panel-inline.active { display: flex; }

    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 2rem;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #ff9f7a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .toolbar h2 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px var(--accent-glow);
    }

    .card-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--bg);
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }

    .video-card:hover .card-thumb img {
      transform: scale(1.05);
    }

    .card-thumb .no-image {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .card-duration {
      position: absolute;
      bottom: 0.5rem;
      right: 0.5rem;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    .card-content {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 0.6rem;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: auto;
    }

    .badge {
      background: var(--bg);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .card-footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
    }

    .card-footer a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .card-footer a:hover { text-decoration: underline; }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }

    .page-info {
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 0 0.75rem;
    }

    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--text-secondary);
      grid-column: 1 / -1;
    }

    .empty-state h2 {
      color: var(--text);
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    .loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 2rem;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.92) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }

    .modal-body {
      padding: 1.5rem;
    }

    .detail-section {
      margin-bottom: 1.25rem;
    }

    .detail-section:last-child { margin-bottom: 0; }

    .detail-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }

    .detail-value {
      font-size: 0.95rem;
      word-break: break-all;
    }

    .detail-value a {
      color: var(--accent);
      text-decoration: none;
    }
    .detail-value a:hover { text-decoration: underline; }

    .files-grid {
      display: grid;
      gap: 0.6rem;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg);
      padding: 0.6rem 0.85rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .file-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      min-width: 90px;
    }

    .file-value {
      font-size: 0.85rem;
      color: var(--text-secondary);
      word-break: break-all;
      flex: 1;
    }

    .file-value.empty { color: #555; font-style: italic; }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.25rem;
      border-radius: var(--radius-sm);
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      transform: translateY(120px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 200;
      max-width: 360px;
      font-size: 0.9rem;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-left-color: var(--error); }
    .toast.success { border-left-color: var(--success); }

    @media (max-width: 768px) {
      main { padding: 1rem; }
      .header-content { flex-direction: column; align-items: flex-start; }
      .video-grid { grid-template-columns: 1fr; }
      .modal { max-height: 85vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">XVideos Crawler</div>
      <div class="controls">
        <div class="tabs">
          <button class="tab active" onclick="switchTab('fresh')" id="tab-fresh">Fresh</button>
          <button class="tab" onclick="switchTab('best')" id="tab-best">Best</button>
        </div>
        <div class="tab-panel-inline active" id="panel-fresh">
          <input type="number" id="crawlPages" min="1" max="10" value="1">
          <button id="btnCrawl" onclick="triggerCrawl()">Crawl</button>
        </div>
        <div class="tab-panel-inline" id="panel-best">
          <input type="text" id="bestYear" value="2018" style="width:70px;text-align:center;">
          <input type="text" id="bestMonth" value="02" style="width:55px;text-align:center;">
          <input type="number" id="bestPages" min="1" max="10" value="1">
          <button id="btnCrawlBest" onclick="triggerCrawlBest()">Crawl</button>
        </div>
        <button class="btn-ghost" onclick="triggerFetchDetails()" id="btnFetchDetails">Fetch Details</button>
      </div>
    </div>
  </header>

  <main>
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">-</div>
        <div class="stat-label">Total Videos</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statDetails">-</div>
        <div class="stat-label">With Details</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statLast">-</div>
        <div class="stat-label">Last Crawl</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statPages">-</div>
        <div class="stat-label">Current Page</div>
      </div>
    </div>

    <div class="toolbar">
      <div style="display:flex;gap:0.5rem;align-items:center;">
        <h2 id="listTitle">Videos</h2>
        <div class="tabs" style="margin-left:0.5rem;">
          <button class="tab active" onclick="switchDataTab('videos')" id="dataTab-videos">Basic</button>
          <button class="tab" onclick="switchDataTab('details')" id="dataTab-details">Details</button>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search videos..." onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn-secondary" onclick="doSearch()">Search</button>
      </div>
    </div>

    <div id="videosContainer">
      <div class="empty-state">
        <h2>Loading...</h2>
        <p>Fetching video data from the API.</p>
      </div>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>

  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle">Video Details</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = window.location.origin;
    let currentPage = 1;
    let currentSearch = '';
    let currentDataTab = 'videos';

    async function fetchStats() {
      try {
        const res = await fetch(`${API_BASE}/api/stats`);
        const data = await res.json();
        document.getElementById('statTotal').textContent = (data.total ?? 0).toLocaleString();
        document.getElementById('statDetails').textContent = (data.total_details ?? 0).toLocaleString();
        document.getElementById('statLast').textContent = data.last_crawl
          ? new Date(data.last_crawl).toLocaleDateString()
          : 'Never';
      } catch (e) {
        console.error('Failed to fetch stats', e);
      }
    }

    async function fetchVideos(page = 1, search = '') {
      currentPage = page;
      currentSearch = search;
      const container = document.getElementById('videosContainer');
      container.classList.add('loading');

      try {
        const endpoint = currentDataTab === 'details' ? '/api/video_details' : '/api/videos';
        const url = new URL(`${API_BASE}${endpoint}`);
        url.searchParams.set('page', page);
        url.searchParams.set('limit', 20);
        if (search) url.searchParams.set('search', search);

        const res = await fetch(url);
        const data = await res.json();

        if (currentDataTab === 'details') {
          renderDetailsVideos(data.videos || []);
        } else {
          renderBasicVideos(data.videos || []);
        }
        renderPagination(data.pagination || {});
        document.getElementById('statPages').textContent = `${page} / ${data.pagination?.pages || 1}`;
      } catch (e) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>Error</h2>
            <p>Failed to load videos. Make sure the API server is running.</p>
          </div>
        `;
        showToast('Failed to load videos', 'error');
      } finally {
        container.classList.remove('loading');
      }
    }

    function renderBasicVideos(videos) {
      const container = document.getElementById('videosContainer');
      if (!videos.length) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>No videos found</h2>
            <p>Run a crawl to populate the database.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '<div class="video-grid">' + videos.map(v => `
        <div class="video-card" onclick="openDetailModal(${v.id})">
          <div class="card-thumb">
            <div class="no-image">No Thumbnail</div>
            ${v.duration ? `<span class="card-duration">${escapeHtml(v.duration)}</span>` : ''}
          </div>
          <div class="card-content">
            <div class="card-title">${escapeHtml(v.title || 'Untitled')}</div>
            <div class="card-meta">
              <span class="badge">${escapeHtml(v.views || '0 views')}</span>
              <span class="badge">${escapeHtml(v.profile_name || 'Unknown')}</span>
            </div>
          </div>
          <div class="card-footer">
            <a href="${escapeHtml(v.url || '#')}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Watch</a>
            ${v.profile_url ? `<a href="${escapeHtml(v.profile_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Profile</a>` : ''}
          </div>
        </div>
      `).join('') + '</div>';
    }

    function renderDetailsVideos(videos) {
      const container = document.getElementById('videosContainer');
      if (!videos.length) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>No details found</h2>
            <p>Click "Fetch Details" to populate video details.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '<div class="video-grid">' + videos.map(v => `
        <div class="video-card" onclick="openDetailModal(${v.id}, true)">
          <div class="card-thumb">
            ${v.image ? `<img src="${escapeHtml(v.image)}" alt="" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\'no-image\\'>No Image</div>'">` : '<div class="no-image">No Image</div>'}
            ${v.duration ? `<span class="card-duration">${escapeHtml(v.duration)}</span>` : ''}
          </div>
          <div class="card-content">
            <div class="card-title">${escapeHtml(v.title || 'Untitled')}</div>
            <div class="card-meta">
              <span class="badge">${escapeHtml(v.views || '0 views')}</span>
              <span class="badge">${escapeHtml(v.videoType || 'Unknown')}</span>
              ${v.videoWidth && v.videoHeight ? `<span class="badge">${v.videoWidth}x${v.videoHeight}</span>` : ''}
            </div>
          </div>
          <div class="card-footer">
            <a href="${escapeHtml(v.url || '#')}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Watch</a>
            ${v.file_high ? `<a href="${escapeHtml(v.file_high)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">HD</a>` : ''}
          </div>
        </div>
      `).join('') + '</div>';
    }

    async function openDetailModal(id, isDetails = false) {
      if (!isDetails && currentDataTab !== 'details') {
        // For basic tab, try to fetch from details db
        try {
          const res = await fetch(`${API_BASE}/api/video_details/${id}`);
          if (res.ok) {
            const data = await res.json();
            showDetailModal(data);
            return;
          }
        } catch (e) {}
        // Fallback: show basic info from current list
        showToast('No detail data available for this video', 'error');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/video_details/${id}`);
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();
        showDetailModal(data);
      } catch (e) {
        showToast('Failed to load detail', 'error');
      }
    }

    function showDetailModal(v) {
      document.getElementById('modalTitle').textContent = v.title || 'Video Details';
      document.getElementById('modalBody').innerHTML = `
        <div class="detail-section">
          <div class="detail-label">URL</div>
          <div class="detail-value"><a href="${escapeHtml(v.url || '#')}" target="_blank">${escapeHtml(v.url || 'N/A')}</a></div>
        </div>
        <div class="detail-section">
          <div class="detail-label">Title</div>
          <div class="detail-value">${escapeHtml(v.title || 'N/A')}</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;">
          <div class="detail-section">
            <div class="detail-label">Duration</div>
            <div class="detail-value">${escapeHtml(v.duration || 'N/A')}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Views</div>
            <div class="detail-value">${escapeHtml(v.views || 'N/A')}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Type</div>
            <div class="detail-value">${escapeHtml(v.videoType || 'N/A')}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;">
          <div class="detail-section">
            <div class="detail-label">Video Width</div>
            <div class="detail-value">${escapeHtml(v.videoWidth || 'N/A')}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Video Height</div>
            <div class="detail-value">${escapeHtml(v.videoHeight || 'N/A')}</div>
          </div>
        </div>
        ${v.image ? `
        <div class="detail-section">
          <div class="detail-label">Thumbnail</div>
          <img src="${escapeHtml(v.image)}" style="max-width:100%;border-radius:var(--radius-sm);border:1px solid var(--border);" alt="">
        </div>
        ` : ''}
        <div class="detail-section">
          <div class="detail-label">Files</div>
          <div class="files-grid">
            ${renderFileRow('Low', v.file_low)}
            ${renderFileRow('High', v.file_high)}
            ${renderFileRow('HLS', v.file_HLS)}
            ${renderFileRow('Thumb', v.file_thumb)}
            ${renderFileRow('Thumb 16:9', v.file_thumb69)}
            ${renderFileRow('Slide', v.file_thumbSlide)}
            ${renderFileRow('Slide Big', v.file_thumbSlideBig)}
          </div>
        </div>
      `;
      document.getElementById('modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function renderFileRow(label, value) {
      if (!value) return `<div class="file-row"><span class="file-label">${label}</span><span class="file-value empty">Not available</span></div>`;
      return `<div class="file-row"><span class="file-label">${label}</span><span class="file-value"><a href="${escapeHtml(value)}" target="_blank">${escapeHtml(value)}</a></span></div>`;
    }

    function closeModal(event) {
      if (event && event.target !== document.getElementById('modal')) return;
      document.getElementById('modal').classList.remove('active');
      document.body.style.overflow = '';
    }

    function renderPagination(pagination) {
      const el = document.getElementById('pagination');
      if (!pagination.pages || pagination.pages <= 1) {
        el.innerHTML = '';
        return;
      }

      const { page, pages } = pagination;
      let html = '';

      html += `<button class="btn-secondary" onclick="fetchVideos(${page - 1}, currentSearch)" ${page <= 1 ? 'disabled' : ''}>Prev</button>`;
      html += `<span class="page-info">Page ${page} of ${pages}</span>`;
      html += `<button class="btn-secondary" onclick="fetchVideos(${page + 1}, currentSearch)" ${page >= pages ? 'disabled' : ''}>Next</button>`;

      el.innerHTML = html;
    }

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => {
        if (t.id.startsWith('tab-')) t.classList.remove('active');
      });
      document.querySelectorAll('.tab-panel-inline').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      document.getElementById('panel-' + name).classList.add('active');
    }

    function switchDataTab(name) {
      currentDataTab = name;
      document.querySelectorAll('[id^="dataTab-"]').forEach(t => t.classList.remove('active'));
      document.getElementById('dataTab-' + name).classList.add('active');
      document.getElementById('listTitle').textContent = name === 'details' ? 'Video Details' : 'Videos';
      fetchVideos(1, currentSearch);
    }

    async function triggerCrawl() {
      const btn = document.getElementById('btnCrawl');
      const pages = parseInt(document.getElementById('crawlPages').value, 10) || 1;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Crawling...';

      try {
        const res = await fetch(`${API_BASE}/api/crawl?pages=${pages}`, { method: 'POST' });
        const data = await res.json();

        if (data.success) {
          showToast(`Crawl complete! Checked ${pages} page(s).`, 'success');
          await fetchStats();
          await fetchVideos(1, currentSearch);
        } else {
          showToast(`Crawl failed: ${data.stderr || data.stdout || 'Unknown error'}`, 'error');
        }
      } catch (e) {
        showToast(`Crawl error: ${e.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crawl';
      }
    }

    async function triggerCrawlBest() {
      const btn = document.getElementById('btnCrawlBest');
      const year = document.getElementById('bestYear').value.trim() || '2018';
      const month = document.getElementById('bestMonth').value.trim() || '02';
      const pages = parseInt(document.getElementById('bestPages').value, 10) || 1;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Crawling...';

      try {
        const url = new URL(`${API_BASE}/api/crawl/best`);
        url.searchParams.set('year', year);
        url.searchParams.set('month', month);
        url.searchParams.set('pages', pages);

        const res = await fetch(url, { method: 'POST' });
        const data = await res.json();

        if (data.success) {
          showToast(`Best crawl complete! ${year}-${month}, ${pages} page(s).`, 'success');
          await fetchStats();
          await fetchVideos(1, currentSearch);
        } else {
          showToast(`Crawl failed: ${data.stderr || data.stdout || 'Unknown error'}`, 'error');
        }
      } catch (e) {
        showToast(`Crawl error: ${e.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crawl';
      }
    }

    async function triggerFetchDetails() {
      const btn = document.getElementById('btnFetchDetails');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Fetching...';

      try {
        const res = await fetch(`${API_BASE}/api/video_details/fetch`, { method: 'POST' });
        const data = await res.json();

        if (data.success) {
          showToast('Details fetch complete!', 'success');
          await fetchStats();
          if (currentDataTab === 'details') await fetchVideos(1, currentSearch);
        } else {
          showToast(`Fetch failed: ${data.stderr || data.stdout || 'Unknown error'}`, 'error');
        }
      } catch (e) {
        showToast(`Fetch error: ${e.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Fetch Details';
      }
    }

    function doSearch() {
      const q = document.getElementById('searchInput').value.trim();
      fetchVideos(1, q);
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Init
    fetchStats();
    fetchVideos();
    setInterval(fetchStats, 30000);
  </script>
</body>
</html>
