<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XVideos Crawler Dashboard</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a20;
      --surface-hover: #22222a;
      --text: #e4e4e7;
      --text-secondary: #a1a1aa;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --border: #27272a;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="text"], input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--accent);
    }

    input[type="number"] { width: 70px; text-align: center; }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: #2e2e36; }

    .tabs {
      display: flex;
      gap: 0.25rem;
      background: var(--bg);
      padding: 0.25rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .tab {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--surface-hover);
      color: var(--text);
    }

    .tab:hover:not(.active) {
      color: var(--text);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: flex; }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .video-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .video-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: border-color 0.2s;
      flex-wrap: wrap;
    }

    .video-row:hover {
      border-color: var(--accent);
    }

    .row-title {
      flex: 1;
      min-width: 200px;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-secondary);
      font-size: 0.875rem;
      flex-wrap: wrap;
    }

    .row-meta .badge {
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }

    .row-actions {
      display: flex;
      gap: 0.75rem;
      margin-left: auto;
    }

    .row-actions a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .row-actions a:hover { text-decoration: underline; }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .page-info {
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 0 0.5rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
    }

    .empty-state h2 {
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.25rem;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      max-width: 320px;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-left-color: #ef4444; }
    .toast.success { border-left-color: #22c55e; }

    @media (max-width: 640px) {
      main { padding: 1rem; }
      .header-content { flex-direction: column; align-items: flex-start; }
      .video-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">XVideos Crawler</div>
      <div class="controls">
        <div class="tabs">
          <button class="tab active" onclick="switchTab('fresh')" id="tab-fresh">Fresh</button>
          <button class="tab" onclick="switchTab('best')" id="tab-best">Best</button>
        </div>
        <div class="tab-panel active" id="panel-fresh">
          <input type="number" id="crawlPages" min="1" max="10" value="1" title="Pages to crawl">
          <button id="btnCrawl" onclick="triggerCrawl()">Crawl</button>
        </div>
        <div class="tab-panel" id="panel-best">
          <input type="text" id="bestYear" value="2018" placeholder="Year" title="Year" style="width:70px;text-align:center;">
          <input type="text" id="bestMonth" value="02" placeholder="Month" title="Month" style="width:60px;text-align:center;">
          <input type="number" id="bestPages" min="1" max="10" value="1" title="Pages to crawl">
          <button id="btnCrawlBest" onclick="triggerCrawlBest()">Crawl Best</button>
        </div>
        <input type="text" id="searchInput" placeholder="Search videos..." onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn-secondary" onclick="doSearch()">Search</button>
      </div>
    </div>
  </header>

  <main>
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">-</div>
        <div class="stat-label">Total Videos</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statLast">-</div>
        <div class="stat-label">Last Crawl</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statPages">-</div>
        <div class="stat-label">Current Page</div>
      </div>
    </div>

    <div class="toolbar">
      <h2>Videos</h2>
    </div>

    <div id="videosContainer">
      <div class="empty-state">
        <h2>Loading...</h2>
        <p>Fetching video data from the API.</p>
      </div>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = window.location.origin;
    let currentPage = 1;
    let currentSearch = '';

    async function fetchStats() {
      try {
        const res = await fetch(`${API_BASE}/api/stats`);
        const data = await res.json();
        document.getElementById('statTotal').textContent = data.total ?? 0;
        document.getElementById('statLast').textContent = data.last_crawl
          ? new Date(data.last_crawl).toLocaleString()
          : 'Never';
      } catch (e) {
        console.error('Failed to fetch stats', e);
      }
    }

    async function fetchVideos(page = 1, search = '') {
      currentPage = page;
      currentSearch = search;
      const container = document.getElementById('videosContainer');
      container.classList.add('loading');

      try {
        const url = new URL(`${API_BASE}/api/videos`);
        url.searchParams.set('page', page);
        url.searchParams.set('limit', 20);
        if (search) url.searchParams.set('search', search);

        const res = await fetch(url);
        const data = await res.json();

        renderVideos(data.videos || []);
        renderPagination(data.pagination || {});
        document.getElementById('statPages').textContent = `${page} / ${data.pagination?.pages || 1}`;
      } catch (e) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>Error</h2>
            <p>Failed to load videos. Make sure the API server is running.</p>
          </div>
        `;
        showToast('Failed to load videos', 'error');
      } finally {
        container.classList.remove('loading');
      }
    }

    function renderVideos(videos) {
      const container = document.getElementById('videosContainer');
      if (!videos.length) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>No videos found</h2>
            <p>Run a crawl to populate the database.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '<div class="video-list">' + videos.map(v => `
        <div class="video-row">
          <div class="row-title" title="${escapeHtml(v.title || 'Untitled')}">${escapeHtml(v.title || 'Untitled')}</div>
          <div class="row-meta">
            <span class="badge">${escapeHtml(v.duration || '-')}</span>
            <span>${escapeHtml(v.views || '-')}</span>
            <span>${escapeHtml(v.profile_name || '-')}</span>
            <span>${v.created_at ? new Date(v.created_at).toLocaleDateString() : '-'}</span>
          </div>
          <div class="row-actions">
            <a href="${escapeHtml(v.url || '#')}" target="_blank" rel="noopener">Watch</a>
            ${v.profile_url ? `<a href="${escapeHtml(v.profile_url)}" target="_blank" rel="noopener">Profile</a>` : ''}
          </div>
        </div>
      `).join('') + '</div>';
    }

    function renderPagination(pagination) {
      const el = document.getElementById('pagination');
      if (!pagination.pages || pagination.pages <= 1) {
        el.innerHTML = '';
        return;
      }

      const { page, pages } = pagination;
      let html = '';

      html += `<button class="btn-secondary" onclick="fetchVideos(${page - 1}, currentSearch)" ${page <= 1 ? 'disabled' : ''}>Prev</button>`;
      html += `<span class="page-info">Page ${page} of ${pages}</span>`;
      html += `<button class="btn-secondary" onclick="fetchVideos(${page + 1}, currentSearch)" ${page >= pages ? 'disabled' : ''}>Next</button>`;

      el.innerHTML = html;
    }

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      document.getElementById('panel-' + name).classList.add('active');
    }

    async function triggerCrawl() {
      const btn = document.getElementById('btnCrawl');
      const pages = parseInt(document.getElementById('crawlPages').value, 10) || 1;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Crawling...';

      try {
        const res = await fetch(`${API_BASE}/api/crawl?pages=${pages}`, { method: 'POST' });
        const data = await res.json();

        if (data.success) {
          showToast(`Crawl complete! Checked ${pages} page(s).`, 'success');
          await fetchStats();
          await fetchVideos(1, currentSearch);
        } else {
          showToast(`Crawl failed: ${data.stderr || data.stdout || 'Unknown error'}`, 'error');
        }
      } catch (e) {
        showToast(`Crawl error: ${e.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crawl';
      }
    }

    async function triggerCrawlBest() {
      const btn = document.getElementById('btnCrawlBest');
      const year = document.getElementById('bestYear').value.trim() || '2018';
      const month = document.getElementById('bestMonth').value.trim() || '02';
      const pages = parseInt(document.getElementById('bestPages').value, 10) || 1;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Crawling...';

      try {
        const url = new URL(`${API_BASE}/api/crawl/best`);
        url.searchParams.set('year', year);
        url.searchParams.set('month', month);
        url.searchParams.set('pages', pages);

        const res = await fetch(url, { method: 'POST' });
        const data = await res.json();

        if (data.success) {
          showToast(`Best crawl complete! Checked ${pages} page(s) for ${year}-${month}.`, 'success');
          await fetchStats();
          await fetchVideos(1, currentSearch);
        } else {
          showToast(`Crawl failed: ${data.stderr || data.stdout || 'Unknown error'}`, 'error');
        }
      } catch (e) {
        showToast(`Crawl error: ${e.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crawl Best';
      }
    }

    function doSearch() {
      const q = document.getElementById('searchInput').value.trim();
      fetchVideos(1, q);
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Init
    fetchStats();
    fetchVideos();
    setInterval(fetchStats, 30000); // refresh stats every 30s
  </script>
</body>
</html>
